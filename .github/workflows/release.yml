name: "Release"

on:
  workflow_dispatch:
    inputs:
      minimal-build-run-id:
        description: "Optional build run ID to promote; defaults to the latest successful Minimal Branch Build on this branch"
        required: false
        type: string

jobs:
  create-release:
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.create-release.outputs.result }}
      version: ${{ steps.get-version.outputs.version }}
      source-run-id: ${{ fromJSON(steps.resolve-build.outputs.result).run_id }}
      source-sha: ${{ fromJSON(steps.resolve-build.outputs.result).head_sha }}
    steps:
      - name: Resolve source build
        id: resolve-build
        uses: actions/github-script@v7
        with:
          script: |
            const requestedRunId = '${{ inputs.minimal-build-run-id }}'.trim()
            let run

            if (requestedRunId !== '') {
              const runId = Number(requestedRunId)

              if (!Number.isInteger(runId)) {
                core.setFailed(`Invalid minimal-build-run-id: ${requestedRunId}`)
                return
              }

              const response = await github.rest.actions.getWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: runId
              })

              run = response.data
            } else {
              const response = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'minimal-build.yml',
                branch: '${{ github.ref_name }}',
                event: 'push',
                status: 'success',
                per_page: 1,
                page: 1
              })

              run = response.data.workflow_runs[0]

              if (!run) {
                core.setFailed(`No successful minimal Branch Build run found for branch '${{ github.ref_name }}'`)
                return
              }
            }

            if (run.name !== 'Minimal Branch Build') {
              core.setFailed(`Workflow run ${run.id} is '${run.name}', expected 'Minimal Branch Build'`)
              return
            }

            if (run.conclusion !== 'success') {
              core.setFailed(`Workflow run ${run.id} has conclusion '${run.conclusion}', expected 'success'`)
              return
            }

            return {
              run_id: run.id,
              head_sha: run.head_sha,
              head_branch: run.head_branch
            }

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Get version from tauri.conf.json
        id: get-version
        shell: bash
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' src-tauri/tauri.conf.json | cut -d'"' -f4)
          echo "Application version from tauri.conf.json: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create Draft Release
        id: create-release
        uses: actions/github-script@v9
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${{ steps.get-version.outputs.version }}`,
              name: `v${{ steps.get-version.outputs.version }}`,
              target_commitish: '${{ fromJSON(steps.resolve-build.outputs.result).head_sha }}',
              draft: true,
              prerelease: false,
              generate_release_notes: true
            })
            return data.id

  publish-release-assets:
    permissions:
      actions: read
      contents: write
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Download promoted artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: handy-*
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.create-release.outputs.source-run-id }}

      - name: Upload artifacts to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          files=(release-artifacts/*)

          if [ ${#files[@]} -eq 0 ]; then
            echo "No artifacts were downloaded from run ${{ needs.create-release.outputs.source-run-id }}"
            exit 1
          fi

          gh release upload "v${{ needs.create-release.outputs.version }}" "${files[@]}" --clobber

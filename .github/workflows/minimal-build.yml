name: "Minimal Branch Build"

# Runs the full cross-platform build on every push to minimal so breakage is
# caught before a manual release is triggered. Artifacts are kept for 30 days
# so any commit on minimal has a downloadable, testable build.

on:
  push:
    branches: [minimal, wip/minimizing]
    paths-ignore:
      - "**/*.md"
      - ".github/workflows/release.yml"
      - "FUNDING.yml"
      - ".github/FUNDING.yml"
      - ".github/ISSUE_TEMPLATE/**"
      - "sponsor-images/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "ubuntu-22.04"
            args: "--bundles deb"
            target: "x86_64-unknown-linux-gnu"
          # - platform: "ubuntu-24.04"
          #   args: "--bundles appimage,rpm"
          #   target: "x86_64-unknown-linux-gnu"
          # - platform: "ubuntu-24.04-arm"
          #   args: "--bundles appimage,deb,rpm"
          #   target: "aarch64-unknown-linux-gnu"

    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }}
      upload-artifacts: true
      sign-binaries: true
    secrets: inherit
